name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  tests:
    permissions:
      contents: read  # actions/checkout in the called workflow
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@06f5123d5a89db10f394aaa1533a5c119b34a48f # v5.10.1
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15", "pypy-3.11"]'
      dependency-manager: uv
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  benchmark:
    needs: tests
    if: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read  # actions/checkout in the called workflow
    uses: $/.github/workflows/benchmarks.yml
  benchmark-publish:
    needs: tests
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write  # github-action-benchmark pushes results and comments on commits
    uses: $/.github/workflows/benchmarks.yml
    with:
      publish: true
