name: Docs
on:
  push:
    branches: [main]
    tags:
      - v*
  pull_request:
    branches: [main]

permissions: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # peaceiris/actions-gh-pages pushes the built docs to gh-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fizyk/actions-reuse/.github/actions/uv@06f5123d5a89db10f394aaa1533a5c119b34a48f # v5.10.1
        with:
          python-version: "3.15"
          command: "sphinx-build -b html docs/source build/html"
      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/html/
          destination_dir: docs/
          enable_jekyll: false
          keep_files: false
